[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "distilled-memory-policy-router"
version = "0.1.0"
description = "Research-engineering scaffold for a lightweight memory policy router."
requires-python = ">=3.10"
dependencies = [
  "pydantic>=2,<3",
]

[tool.setuptools.packages.find]
where = ["."]
include = ["src*"]

[tool.ruff]
line-length = 100
