# QLoRA training config — Qwen3-4B Unit DSL
# Context 5.5-A2: fixed eval/save to epoch-based
# Subset: 500

base_model_path: /home/abc16/hf_models/Qwen3-4B-Instruct-2507
output_dir: results/v05_lora/qwen3_4b_dsl_500
train_file: data/v05/train/subsets/v05_train_500_sft_messages.jsonl
eval_file: data/v05/dev/v05_dev_sft_messages.jsonl

# QLoRA — 4-bit quantization for 11GB GPU
load_in_4bit: true
bnb_4bit_compute_dtype: bfloat16
bnb_4bit_quant_type: nf4
bnb_4bit_use_double_quant: true

# LoRA hyperparameters
lora_r: 8
lora_alpha: 16
lora_dropout: 0.05
lora_target_modules:
  - q_proj
  - k_proj
  - v_proj
  - o_proj

# Training
num_train_epochs: 3
per_device_train_batch_size: 4
per_device_eval_batch_size: 4
gradient_accumulation_steps: 4
learning_rate: 2.0e-4
lr_scheduler_type: cosine
warmup_ratio: 0.1
optim: adamw_8bit
weight_decay: 0.01
max_seq_length: 2048
packing: false

# Precision
bf16: true
tf32: true

# Evaluation (epoch-based so 125/250 get eval checkpoints)
eval_strategy: epoch
save_strategy: epoch
save_total_limit: 3
load_best_model_at_end: true
metric_for_best_model: eval_loss

# Logging
logging_steps: 10
report_to: none

# Reproducibility
seed: 42
data_seed: 42
