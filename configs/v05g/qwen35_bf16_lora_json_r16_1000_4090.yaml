# BF16 standard LoRA training config — Qwen3.5 Unit JSON (RTX 4090 24GB FALLBACK)
# v0.5g experiment: BF16 standard LoRA r=16 (targeted data scaling)
# Trains on: 1000-targeted = 500-control + 500 repaired targeted-balanced
# GPU: RTX 4090 24GB — uses batch_size=2, grad_accum=8, gradient checkpointing
# Do NOT use this config on L40S/A100. Use qwen35_bf16_lora_json_r16_1000.yaml instead.

base_model_path: "${QWEN35_MODEL_PATH}"
output_dir: results/v05g_bf16_lora/qwen35_json_r16_1000_4090
train_file: data/v05g/json_sft/v05g_train_1000_targeted_json_sft_messages.jsonl
eval_file: data/v05b/json_sft/v05b_dev_json_sft_messages.jsonl

interface: unit_json
quantization: none

lora_r: 16
lora_alpha: 32
lora_dropout: 0.05
lora_target_modules:
  - q_proj
  - k_proj
  - v_proj
  - o_proj
  - in_proj_qkv
  - out_proj

num_train_epochs: 3
per_device_train_batch_size: 2       # reduced for 24GB VRAM
per_device_eval_batch_size: 2
gradient_accumulation_steps: 8       # increased to maintain effective batch ~16
learning_rate: 2.0e-4
lr_scheduler_type: cosine
warmup_ratio: 0.1
optim: adamw_torch
weight_decay: 0.01
max_seq_length: 2048
packing: false
gradient_checkpointing: true         # critical for 24GB VRAM

bf16: true
tf32: true

eval_strategy: epoch
save_strategy: epoch
save_total_limit: 3
load_best_model_at_end: true
metric_for_best_model: eval_loss

logging_steps: 10
report_to: none

seed: 42
data_seed: 42
